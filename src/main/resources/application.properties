# Default / dev profile
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/aibridge
quarkus.datasource.username=postgres
quarkus.datasource.password=postgres
quarkus.hibernate-orm.database.generation=none
quarkus.flyway.migrate-at-start=true
quarkus.redis.hosts=redis://localhost:6379
quarkus.http.cors=true
quarkus.http.cors.origins=http://localhost:4200
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=Content-Type,X-Tenant-ID,X-Feature,X-Request-ID,Authorization
quarkus.http.limits.max-body-size=1M

# Docker profile
%docker.quarkus.datasource.jdbc.url=jdbc:postgresql://postgres:5432/aibridge
%docker.quarkus.redis.hosts=redis://redis:6379

# AIBridge custom config
ui.required=true
# Cache mode: "in-memory" (default) or "redis"
# When using in-memory mode, quarkus.redis.hosts is not required
cache.mode=in-memory
aibridge.encryption.key=CHANGE_ME_IN_PRODUCTION_32CHARS!
aibridge.queue.timeout-ms=5000
aibridge.queue.poll-interval-ms=50
aibridge.queue.max-depth=1000
aibridge.load-test.max-parallel=500
# Auth
aibridge.auth.api-key=CHANGE_ME_IN_PRODUCTION
aibridge.auth.token-validity-minutes=60
aibridge.endpoint.allow-http=true
aibridge.allowed-provider-hosts=api.openai.com,api.anthropic.com,api.cerebras.ai,bedrock-runtime.*.amazonaws.com,*.cloud.ibm.com

%prod.aibridge.endpoint.allow-http=false

# Health
quarkus.smallrye-health.ui.enable=true

# Static resources: revalidate on every request (cheap 304s) instead of the default
# 24h immutable cache. The Angular entry point (index.html, and every SPA route that
# reroutes to it) and /assets/api-documentation.html are served under UNHASHED names —
# caching them as immutable means users keep a stale app shell, pointing at old chunk
# hashes, for up to a day after a redeploy.
quarkus.http.static-resources.max-age=0S

# OpenAPI / Swagger UI
# Swagger UI is dev-only by default; this ships it in the runtime image too so the
# documentation travels with the service. Set quarkus.swagger-ui.always-include=false
# for a deployment that should not expose its schema.
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/q/swagger-ui
quarkus.swagger-ui.title=AIBridge API
quarkus.smallrye-openapi.path=/q/openapi
mp.openapi.extensions.smallrye.info.title=AIBridge Gateway API
mp.openapi.extensions.smallrye.info.version=1.0.0
mp.openapi.extensions.smallrye.info.description=OpenAI-compatible LLM gateway with multi-tenant routing, rate pacing and failover.


# Logging (override via env: AIBRIDGE_LOG_LEVEL / AIBRIDGE_LOG_APP_LEVEL)
aibridge.log.level=INFO
aibridge.log.app-level=DEBUG
quarkus.log.level=${aibridge.log.level}
quarkus.log.category."com.aibridge".level=${aibridge.log.app-level}
quarkus.log.console.json=false
%prod.quarkus.log.console.json=true
